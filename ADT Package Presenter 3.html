<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADT Package Presenter</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--fg:#0b1f5c;--mu:#566077;--cd:#fff;--ln:#d5dbea;--ac:#1d5fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--fg:#e8edfb;--mu:#a3adc7;--cd:#171f36;--ln:#2a3556;--ac:#8ab0ff}}
:root[data-theme="dark"]{--bg:#0e1424;--fg:#e8edfb;--mu:#a3adc7;--cd:#171f36;--ln:#2a3556;--ac:#8ab0ff}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 'Montserrat',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0;padding:12px 16px 0;font-weight:800;text-align:center}
.lg0{display:flex;justify-content:center;padding:18px 16px 0}.lg0 span{background:#fff;border-radius:18px;padding:14px 20px;box-shadow:0 2px 12px rgba(11,31,92,.14)}.lg0 img{display:block;width:min(260px,70vw);height:auto}
.sub{margin:4px 16px 0;color:var(--mu);font-size:14px;text-align:center}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.ch{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--ln);background:var(--cd);color:var(--fg);font:700 14px 'Montserrat',sans-serif;cursor:pointer}
.ch[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
main{max-width:860px;margin:0 auto;padding:6px 16px 28px}
#fw{max-width:816px;margin:0 auto;overflow:hidden;position:relative;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#fs{width:816px;height:1056px;transform-origin:0 0}
.hint{color:var(--mu);font-size:14px;margin:12px 0 4px;text-align:center}
h2{font-size:18px;margin:22px 0 10px;font-weight:800}
details{background:var(--cd);border:1px solid var(--ln);border-radius:14px;margin:0 0 10px;overflow:hidden}
details[open]{border-color:var(--ac)}
summary{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;flex:none;width:9px;height:9px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
summary img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.nm b{display:block;font-size:15px}.nm small{color:var(--mu);font-size:13px}
.pb{display:grid;gap:14px;padding:2px 14px 16px}
.pb img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:#fff}
.pb ul{margin:6px 0;padding-left:20px}.pb li{margin:5px 0}
.tg2{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ac)}
.fn{margin:6px 0 0;font-size:12.5px;color:var(--mu)}
@media (min-width:640px){.pb{grid-template-columns:280px 1fr}}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px;border:1px dashed var(--ln);border-radius:14px;margin:0 0 10px;color:var(--mu)}
.row em{margin-left:auto;font-size:12.5px}
.pg{display:flex;gap:10px;margin-top:18px}
[hidden]{display:none!important}
.gd{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding-top:8px}
.cd{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;min-height:120px;border-radius:16px;border:2px solid var(--ln);background:var(--cd);color:var(--fg);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.cd:hover,.cd:focus-visible{border-color:var(--ac);transform:translateY(-2px)}
.cn{font-size:21px;font-weight:800;line-height:1.15}
.cp{font-weight:800;color:var(--ac);font-size:17px}.cp small{font-weight:600;color:var(--mu);font-size:13px}
.ct{color:var(--mu);font-size:13.5px}
.cs{display:flex;gap:6px;margin-top:auto}.cs img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff}
@keyframes op{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
main.in{animation:op .28s ease-out}
@media (prefers-reduced-motion:reduce){main.in{animation:none}.cd{transition:none}}
.pg .ch{flex:1;border-radius:14px;min-height:52px}
.fl{width:816px;height:1056px;padding:14px;background:#fff;font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif;color:#0b1f5c;text-align:left}
.fl *{box-sizing:border-box}
.fr{height:100%;border:3px solid #0b1f5c;background-color:#f3f3f3;background-image:radial-gradient(#c5d0ea 1.3px,transparent 1.6px);background-size:17px 17px;padding:20px 28px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.fr p{margin:0}
.hd{width:100%;display:flex;gap:26px}
.bx{height:84px;border:4px solid #0b1f5c;background:#f3f3f3;box-shadow:5px 5px 0 #b8c6ee;flex:1}
.qv{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:29px;color:#111}
.ad{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:23px;line-height:1.05;color:#111}
.ad img{width:66px;height:66px;flex:none}
.ti{height:72px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:900;color:#fff;paint-order:stroke fill;letter-spacing:-1px;margin:0 -14px}
.tg{font-size:21px;font-weight:700;text-align:center}
.hf{border:5px solid #0b1f5c;box-shadow:5px 5px 0 #b8c6ee;background:#fff;line-height:0}
.hf img{width:270px;height:187px;object-fit:cover;display:block}
.pr{display:flex;align-items:center;justify-content:center;width:430px;height:56px;border:4px solid #0b1f5c;border-radius:50%;box-shadow:3px 3px 0 #b8c6ee;background:#f3f3f3;font-size:38px;font-weight:800;letter-spacing:-.5px}
.fb{width:100%;border:4px solid #0b1f5c;border-radius:20px;background:#f3f3f3;padding:10px 18px 9px;box-shadow:4px 4px 0 #b8c6ee}
.kh{margin:0 0 7px!important;font-size:21px;font-weight:800}
.gr{display:grid;column-gap:14px}
.it{display:flex;align-items:center;gap:10px;font-weight:700;line-height:1.15}
button.it{background:none;border:0;padding:0;margin:0;color:inherit;text-align:left;cursor:pointer;border-radius:10px}
button.it:hover .th,button.it:focus-visible .th{box-shadow:0 0 0 3px #1d5fd6}
button.it:focus-visible{outline:3px solid #1d5fd6;outline-offset:2px}
.th{overflow:hidden;flex:none;border-radius:8px;background:#fff;box-shadow:0 0 0 2px #0b1f5c;margin:2px;display:inline-flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.row .th{box-shadow:0 0 0 1px var(--ln)}
.fb .nt{font-size:11.5px;line-height:1.25;font-weight:600;margin-top:7px}
.fb .fp{font-size:11.5px;line-height:1.25;color:#566077;margin-top:5px}
.cta{font-size:27px;font-weight:800;color:#1d5fd6;text-align:center}
.ft{width:100%;border-top:2px solid #0b1f5c;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.nm2{font-size:31px;font-weight:800;letter-spacing:-.3px}
.ft .lc{font-size:14px;font-weight:600;color:#333;margin-top:6px}
.qw{background:#fff;padding:5px;line-height:0;flex:none}.qw img{width:84px;height:84px;display:block}

.fl{box-sizing:border-box;line-height:1.4;font-size:16px}
.fl.xa .hf img{width:214px;height:148px}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:11;display:flex;border:2px solid var(--ln);border-radius:20px;overflow:hidden;background:var(--cd)}
.lang button{border:0;background:none;color:var(--fg);font:700 13px system-ui,sans-serif;min-width:40px;min-height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ac);color:var(--bg)}
.rep{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:6px 0 12px}
.rep span{flex:1;min-width:170px;font-size:14px}.rep b{display:block}.rep small{display:block;color:var(--mu);margin-top:2px}
.setup{background:var(--cd);border:2px solid var(--ac);border-radius:14px;padding:14px;margin:0 0 12px}
.setup label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.setup input,.num{width:100%;min-height:44px;border:2px solid var(--ln);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
.setup .bt{display:flex;gap:10px;margin-top:14px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.act .ch{flex:1 1 130px;display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:48px;border-radius:14px}
.sum{background:var(--ac);color:var(--bg);border-radius:14px;padding:12px 14px;font-weight:800;margin:0 0 10px}
.sum small{display:block;font-weight:600}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--cd);margin:0 0 10px}
.opt small{display:block;color:var(--mu);font-size:12.5px}.opt input{width:24px;height:24px;flex:none}
.ao{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:14px;background:var(--cd);margin:0 0 10px}
.ao>img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.ao .nm{flex:1;min-width:0}.ao small{display:block;color:var(--mu);font-size:12.5px}.ao .num{width:110px;min-height:38px;margin-top:2px;font-size:15px}
.stp{display:flex;align-items:center;gap:8px;flex:none}
.stp button{width:44px;height:44px;border-radius:12px;border:2px solid var(--ln);background:var(--cd);color:var(--fg);font:700 20px system-ui,sans-serif;cursor:pointer}
.stp b{min-width:20px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.fcta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--ac);color:var(--bg);border:0;border-radius:16px;padding:16px;margin:0 0 12px;cursor:pointer;font:inherit}
.fcta b{font-size:18px}.fcta small{font-size:14px}
.fq{background:var(--cd);border:2px solid var(--ac);border-radius:14px;padding:14px;margin:0 0 12px}
.fq h3{margin:4px 0 6px;font-size:18px}.fq p{margin:6px 0}.fq>small{color:var(--mu);font-weight:700;font-size:13px}
.fo{display:block;width:100%;text-align:left;border-radius:14px;min-height:56px;margin-top:8px;padding:10px 14px;line-height:1.3}
.fq .bt{display:flex;gap:10px;margin:12px 0}.fq .bt .ch{flex:1;border-radius:14px;min-height:48px}
.lk{background:none;border:0;color:var(--ac);font:inherit;text-decoration:underline;cursor:pointer;padding:6px 0;min-height:44px;text-align:left}
@media print{@page{size:letter;margin:0}body>*:not(#pkg),#pkg>*:not(#fw){display:none!important}#fw{box-shadow:none!important;border-radius:0!important;height:auto!important;max-width:none!important;overflow:visible!important}#fs{transform:none!important}}
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
